[project]
name = "stepsolver"
version = "0.1.0"
description = "Strictly typed step-by-step symbolic mathematics solver."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Davide", email = "davidegalilei2018@gmail.com" },
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "sympy (>=1.14.0,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.3,<0.53.0)",
]

[project.scripts]
stepsolver = "stepsolver.cli:main"
stepsolver-web = "stepsolver.web:main"
stepsolver-isolated = "stepsolver.isolated_runner:main"

[tool.poetry]
packages = [{ include = "stepsolver", from = "src" }]
include = ["src/stepsolver/py.typed", "src/stepsolver/web_assets/**/*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pyright (>=1.1.411,<2.0.0)",
    "ty (>=0.0.72,<0.0.73)",
    "httpx2 (>=2.10.0,<3.0.0)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # This mirrors a third-party package boundary rather than project source.
    "typings",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # These conflict with Ruff's formatter.
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    # Choose one rule from each mutually exclusive docstring pair.
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # Distribution metadata does not declare a copyright owner or license yet.
    "missing-copyright-notice",
    # Short API summaries remain readable without repetitive Returns/Raises sections.
    "docstring-missing-returns",
    "docstring-missing-exception",
]
preview = true
explicit-preview-rules = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert"]
"src/stepsolver/cli.py" = ["print"]
"src/stepsolver/formatter.py" = ["complex-structure", "too-many-return-statements"]
"src/stepsolver/latex.py" = [
    "complex-structure",
    "magic-value-comparison",
    "too-many-branches",
    "too-many-return-statements",
]
"src/stepsolver/mathjson.py" = [
    "complex-structure",
    "f-string-in-exception",
    "magic-value-comparison",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "too-many-branches",
    "too-many-return-statements",
]
"src/stepsolver/parser.py" = [
    "complex-structure",
    "f-string-in-exception",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "too-many-branches",
]
"src/stepsolver/sympy_backend.py" = [
    "too-many-locals",
    "too-many-return-statements",
]
"src/stepsolver/sympy_conversion.py" = [
    "complex-structure",
    "f-string-in-exception",
    "magic-value-comparison",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "too-many-branches",
    "too-many-return-statements",
]
"src/stepsolver/sympy_execution.py" = [
    "complex-structure",
    "magic-value-comparison",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-statements",
]
"src/stepsolver/sympy_rendering.py" = [
    "complex-structure",
    "too-many-branches",
    "too-many-return-statements",
]
"src/stepsolver/sympy_steps.py" = ["magic-value-comparison"]
"src/stepsolver/sympy_support.py" = [
    "f-string-in-exception",
    "raise-vanilla-args",
    "too-many-return-statements",
]
"src/stepsolver/sympy_verification.py" = [
    "complex-structure",
    "magic-value-comparison",
    "raise-vanilla-args",
    "raw-string-in-exception",
]
"src/stepsolver/derivation/*.py" = ["too-many-arguments", "too-many-locals"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src:typings"
files = ["src/stepsolver", "tests"]
plugins = ["pydantic.mypy"]
exclude_gitignore = true
follow_imports = "silent"
follow_untyped_imports = true
explicit_package_bases = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
strict_bytes = true
warn_incomplete_stub = true
warn_unused_configs = true
enable_error_code = ["deprecated", "exhaustive-match"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
stubPath = "typings"
include = ["src/stepsolver", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportPrivateUsage = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"
reportUnreachable = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]
extra-paths = ["./typings"]

[tool.ty.src]
include = ["src/stepsolver", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["stepsolver"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
